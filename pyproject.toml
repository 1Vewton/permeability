[project]
name = "permeability"
version = "0.1.0"
description = "A python package for calculating permeability"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.0",
    "numpy>=2.4.6",
]

[dependency-groups]
test = [
    "flake8>=7.3.0",
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
permeability_mcp = "permeability.mcp.Server:run"
